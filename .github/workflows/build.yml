name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: v6.0.0-alpha.1   # GD 2.2091 = Geode v6 (mod.json 의 "geode" 와 같아야 함)
          target: Win64

      - uses: actions/upload-artifact@v4
        with:
          name: IconPainter
          path: ${{ steps.build.outputs.build-output }}
